name: Deploy to michiru
on:
  push:
    branches:
      - master
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Execute script on remote server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            ~/deploymithical.sh

      - name: Ping Kuma (success)
        if: success()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.KUMA_PUSH_URL }}?status=up&msg=deployed-${{ github.sha }}"

      - name: Ping Kuma (failure)
        if: failure()
        run: curl -fsS -m 10 --retry 3 "${{ secrets.KUMA_PUSH_URL }}?status=down&msg=deploy-failed-${{ github.sha }}"
